<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ebru'nun Bahçesi 🌷</title><style>
:root{--cream:#fff8e9;--brown:#513d2e;--green:#587f58;--sage:#e9efe1}*{box-sizing:border-box}body{margin:0;background:#e8eadc;color:var(--brown);font-family:Georgia,serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #e0a64d;outline-offset:3px}.app{min-height:100dvh;display:grid;place-items:center;padding:12px}.scene{width:min(1050px,100%);overflow:hidden;border-radius:24px;border:7px solid #fdf3df;box-shadow:0 18px 60px #4732224a;background:var(--cream)}.start{min-height:min(720px,92dvh);padding:50px 20px;background:linear-gradient(#fffaeacb,#fffaeacb),url('gorseller/bahce-baslangic.webp') center/cover;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.start h1{font-size:clamp(40px,7vw,77px);line-height:1.08;margin:16px 0}.start p{max-width:500px;font-size:clamp(17px,2vw,21px);line-height:1.6}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:white;border:0;border-radius:32px;padding:12px 24px;box-shadow:0 5px 0 #345735;font-weight:bold;transition:transform .2s}.button:hover{transform:translateY(-2px)}.button:active{transform:translateY(2px);box-shadow:0 2px 0 #345735}.button:disabled{opacity:.65;cursor:wait}.button.alt{background:#dfc9a7;color:#513d2e;box-shadow:none}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:#fff9ec}.bar strong{font-size:clamp(15px,2.5vw,20px)}.count{font-size:14px;background:#e8efe2;border-radius:20px;padding:7px 12px}.garden{position:relative;aspect-ratio:1648/928;background:url('gorseller/bahce-baslangic.webp') center/100% 100% no-repeat}.spot{position:absolute;transform:translate(-50%,-50%);height:21%;width:13%;border:2px solid transparent;border-radius:45%;background:transparent;transition:background .2s,transform .2s}.spot:hover{transform:translate(-50%,-50%) scale(1.06);background:#fff4b830;border-color:#fff8ce}.spot .check{position:absolute;right:2%;top:5%;background:#fffae9;border-radius:25px;font-size:clamp(10px,2vw,18px);padding:3px 6px;box-shadow:0 2px 6px #0005}.spot .bloom{font-size:clamp(19px,4vw,50px);filter:drop-shadow(0 4px 3px #3227)}.spot .spot-name{position:absolute;bottom:-12%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff8e9ef;padding:3px 5px;border-radius:9px;font-size:clamp(9px,1.25vw,14px);box-shadow:0 2px 5px #0003}.foot{padding:15px 10px;text-align:center;background:#fff9ec;font-size:14px}.flower-page{min-height:590px;background:radial-gradient(ellipse at top,#fffdf2,#e5eedb 75%,#dfddc8);padding:16px 20px 25px;text-align:center}.flower-page h2{margin:16px 0 0;font-size:clamp(27px,4vw,40px)}.sub{margin:8px auto;color:#735e4c}.flower-stage{position:relative;width:min(365px,95%);height:330px;margin:auto;display:grid;place-items:center}.plant-svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 5px #56482d24)}.plant-svg .stem{stroke:#547d42;stroke-width:9;fill:none;stroke-linecap:round;stroke-dasharray:170;stroke-dashoffset:170;transition:stroke-dashoffset 1.1s ease}.plant-svg .leaf{fill:#6b9955;transform:scale(0);transform-origin:center;transition:transform .75s cubic-bezier(.18,1.6,.5,1)}.plant-svg .bud{transform:scale(0);transform-origin:180px 105px;transition:transform .65s}.plant-svg .petal{transform:scale(0);transform-origin:180px 105px;transition:transform .85s cubic-bezier(.22,1.5,.43,1)}.plant-svg .center{transform:scale(0);transform-origin:180px 105px;transition:transform .7s}.plant-svg[data-stage="1"] .stem,.plant-svg[data-stage="2"] .stem,.plant-svg[data-stage="3"] .stem{stroke-dashoffset:0}.plant-svg[data-stage="2"] .leaf,.plant-svg[data-stage="3"] .leaf{transform:scale(1)}.plant-svg[data-stage="2"] .bud{transform:scale(1)}.plant-svg[data-stage="3"] .petal,.plant-svg[data-stage="3"] .center{transform:scale(1)}.plant-svg[data-stage="3"] .bud{transform:scale(0)}.plant-svg[data-stage="3"] .flower-head{animation:sway 3s ease-in-out infinite alternate;transform-origin:180px 170px}.pot{filter:drop-shadow(0 5px 3px #563e3229)}.water-drops{position:absolute;top:62px;left:19%;font-size:42px;opacity:0;pointer-events:none;transform:rotate(20deg)}.water-drops.watering{animation:pour 1.7s ease-in-out forwards}.status{min-height:24px;font-size:16px;color:#5e7451}.memory{width:min(660px,100%);margin:12px auto 0;padding:18px;border-radius:14px;background:#fffbf1;border:2px solid #e5d7b9;box-shadow:0 6px 16px #4c352219;animation:slide .65s ease-out}.memory p{white-space:pre-line;line-height:1.65}.memory img{max-width:100%;max-height:240px;object-fit:contain;border:8px solid white;box-shadow:0 4px 12px #4323;transform:rotate(-1deg)}.memory .photo-missing{border:1px dashed #cbbd9e;border-radius:10px;padding:18px;color:#867760;font-size:14px}.row{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.final{min-height:610px;padding:22px 15px;text-align:center;background:linear-gradient(#fffae8e0,#fffae8e0),url('gorseller/bahce-final.webp') center/cover}.final h2{font-size:clamp(30px,5vw,52px)}.daisy-svg{max-width:340px;width:80%;height:290px;filter:drop-shadow(0 5px 5px #382d202b)}.daisy-petal-group{transition:opacity .45s,transform .6s;cursor:pointer;transform-box:fill-box;transform-origin:center center;transform:translate(var(--tx),var(--ty)) rotate(var(--rot))}.daisy-petal-group.gone{opacity:0;transform:translate(calc(var(--tx) + var(--fallx)), calc(var(--ty) + var(--fally))) rotate(calc(var(--rot) + 18deg))}.final-status{font-size:clamp(20px,4vw,29px);font-weight:bold;min-height:46px}.small{font-size:13px;color:#786d5b}.hidden{display:none!important}@keyframes slide{from{opacity:0;transform:translateX(35px)}to{opacity:1;transform:translateX(0)}}@keyframes pour{0%{opacity:0;transform:translate(-25px,-15px) rotate(-22deg)}35%{opacity:1}80%{opacity:1;transform:translate(55px,90px) rotate(12deg)}100%{opacity:0;transform:translate(65px,108px)}}@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}@media(max-width:650px){.app{padding:3px}.scene{border-width:3px;border-radius:12px}.bar{padding:10px}.garden{aspect-ratio:1648/928}.spot{width:15%;height:26%}.spot .spot-name{font-size:9px}.flower-page{padding:10px;min-height:580px}.flower-stage{height:270px}.memory{padding:11px}.start{min-height:90dvh}}

/* Ana bahçede çiçekler, orijinal saksıların üstünde bağımsız katmanlar */
.garden .garden-plant{position:absolute;display:block;transform:translate(-50%,-100%);height:auto;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 2px #44352425);animation:leafAppear .8s ease-out both;z-index:1}
.garden .spot{z-index:3;overflow:visible}
.spot .check{z-index:4}.spot .spot-name{z-index:4}
@keyframes leafAppear{from{opacity:0;transform:translate(-50%,-93%) scale(.91)}to{opacity:1;transform:translate(-50%,-100%) scale(1)}}
@media(prefers-reduced-motion:reduce){.garden .garden-plant{animation:none}}

/* Yakın çekim: çizgiyle büyüyen eski bitki ve açarken suluboya çiçek */
.flower-page{min-height:600px;padding:15px 25px 26px}
.flower-layout{display:flex;align-items:center;justify-content:center;gap:0;max-width:985px;margin:10px auto 0;transition:gap .7s ease}
.plant-column{width:min(440px,100%);min-width:0;flex:0 1 440px;transition:flex-basis .8s ease,transform .8s ease}
.flower-layout.has-note{gap:24px}
.flower-layout.has-note .plant-column{flex-basis:43%;transform:translateX(-7px)}
.flower-stage{width:min(360px,100%);height:330px;position:relative;isolation:isolate}
.watercolor-bloom{position:absolute;left:50%;bottom:74px;width:56%;height:230px;object-fit:contain;object-position:center bottom;pointer-events:none;opacity:0;transform:translateX(-50%) scale(.68) translateY(17px);transform-origin:50% 100%;transition:opacity .75s ease,transform 1.05s cubic-bezier(.19,1,.28,1);z-index:2;filter:drop-shadow(0 2px 2px #3826161e)}
.flower-stage.is-bloomed .watercolor-bloom{opacity:1;transform:translateX(-50%) scale(1) translateY(0)}
.flower-stage.is-bloomed .plant-svg .flower-head{opacity:0;transition:opacity .5s ease}
.flower-stage.is-bloomed .plant-svg .leaf{opacity:.28;transition:opacity .5s ease}
.flower-stage.is-bloomed .plant-svg .stem{opacity:.30;transition:opacity .5s ease}
.flower-stage .pot{position:relative;z-index:3}
/* Fotoğraf ve elde yazılmış kâğıt: alt yerine sağdan açılır. */
.memory{flex:0 1 0;width:0;max-width:none;min-width:0;max-height:0;overflow:hidden;opacity:0;margin:0;padding:0;border:0;box-shadow:none;transform:translateX(42px);background:transparent;transition:flex-basis .75s ease,opacity .65s ease .12s,transform .75s ease,max-height .75s ease}
.memory.hidden{display:none!important}
.memory.is-open{display:block;flex:1 1 54%;width:auto;max-height:740px;opacity:1;transform:translateX(0);overflow:visible}
.memory-paper{position:relative;background:repeating-linear-gradient(to bottom,transparent 0px,transparent 33px,#aab8ac22 34px,#aab8ac22 35px),linear-gradient(115deg,#fffaf0,#f4e7cf);padding:26px 26px 21px;border:1px solid #ddc7a2;box-shadow:3px 5px 0 #e1caa6,0 12px 24px #5c3c2924;transform:rotate(.7deg);border-radius:3px;text-align:left}
.memory-paper::before{content:'✿';position:absolute;right:16px;top:10px;color:#c78d90;font-size:23px}
.memory-paper h3{font-size:22px;font-weight:normal;color:#6a5140;margin:0 25px 12px 0;font-style:italic}
.memory-paper .note-text{font-family:Georgia,'Times New Roman',serif;font-size:16px;font-weight:400;white-space:pre-line;line-height:1.6;color:#735e4c;margin:12px 0 18px;overflow-wrap:anywhere}
.memory-paper .signature{font-family:'Segoe Print','Comic Sans MS',cursive;color:#95745b;text-align:right;font-size:14px;margin-bottom:12px}
.memory-photos{display:flex;gap:10px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.memory-photos img{display:block;width:min(43%,170px);height:145px;object-fit:cover;max-height:none;border:8px solid #fffdf6;border-bottom-width:24px;box-shadow:0 3px 9px #46362d32;transform:rotate(-3deg)}
.memory-photos img:nth-child(even){transform:rotate(4deg)}
/* Üç fotoğrafta yalnızca genişliği eşitle, mevcut çerçeve ve yüksekliği koru. */
.memory-photos:has(img:nth-of-type(3)){flex-wrap:nowrap}
.memory-photos:has(img:nth-of-type(3)) img{width:calc((100% - 20px)/3);flex:0 1 calc((100% - 20px)/3);min-width:0}
.memory-photos .photo-missing{font-size:13px;max-width:310px;background:#fff8ea9e}
.memory-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:18px}
@media(max-width:720px){.flower-page{padding:11px 12px}.flower-layout,.flower-layout.has-note{flex-direction:column;gap:12px}.plant-column,.flower-layout.has-note .plant-column{width:100%;flex:unset;transform:none}.flower-stage{height:280px;max-width:330px}.watercolor-bloom{bottom:64px;height:188px}.memory.is-open{flex:auto;width:100%;max-height:none}.memory-paper{padding:18px}.memory-paper .note-text{font-size:16px}.memory-photos img{height:125px}}
@media(prefers-reduced-motion:reduce){.memory,.plant-column,.watercolor-bloom{transition:none!important}}
</style></head><body><div id="app" class="app"></div><script>
// İÇERİKLER: Sadece name, photo ve message alanlarını düzenlemen yeterli.
// Fotoğrafları fotograflar klasörüne frezya.jpg gibi isimlerle koyabilirsin.
const flowers=[
{name:'Frezya',meaning:'Dostluk ve güven',asset:'gorseller/frezya-acmis.webp',photo:'frezya.jpg',message:'Her zaman bizi dinleyeceğine olan güvenimiz sonsuz. Senin yanındayken her türlü düşüncemizi ve duygumuzu hiç çekinmeden dile getirebiliyoruz. Bazen farkına bile varmadan, hiç düşünmeden konuşurken, içimizden geçenleri sana anlatırken buluyoruz kendimizi. Bence dostluklarının temelinde de tam olarak bu var: İnsanlara verdiğin güven. Birbirimize güvenmenin her zaman kolay olmadığı bu dünyada, sana olan güvenimiz hep tam. Sen de her zaman bize güvenebilirsin arkadaşım. Umarım hayatına giren herkes sana aynı güveni ve samimiyeti hissettirir. ♡',color:'#eb94ad',petals:6,x:31.7,y:27.4},
{name:'Lavanta',meaning:'Huzur',asset:'gorseller/lavanta-acmis.webp',photo:'lavanta.jpg',message:'Kendi hayatının içinde kendine kurduğun o küçük, huzurlu dünya, seni sen yapan en güzel şeylerden biri. Yeni şeyler denemekten, üretmekten zevk alman ve hayatın küçük ayrıntılarını fark edebilmen bizde büyük bir hayranlık uyandırıyor. Bilinmeze doğru çıkılan küçük bir yürüyüş... Yol boyunca karşılaştığın bir çiçek ve o çiçeği hep yanında tutabilmek için özenle kurutuşun. Belki de senin hayata bakışını en güzel anlatan şeylerden biri bu: Başkalarının fark etmeden geçip gidebileceği şeylerde güzellik bulabilmen. Umarım hayatın hep böyle huzurlu olur ve sen küçük şeylerde mutluluk bulmayı hiç bırakmazsın arkadaşım. Hem daha 3D printer ile yapılacak çok fazla şey var! ♡',color:'#9c84be',petals:8,x:51.5,y:27.4},
{name:'Unutmabeni',meaning:'Unutulmaz anılar',asset:'gorseller/unutmabeni-acmis.webp',photo:'unutmabeni.jpg',message:'Her bir araya geldiğimizde tekrar tekrar hatırlayıp güldüğümüz, eğlendiğimiz sayısız anı... Hepsinin en güzel yanı da birlikte olmak. Birlikte yaptığımız İzmir turları, çıktığımız tatiller, kutladığımız doğum günleri, partiler... Hepsini hatırlamak bile yüzüme bir gülümseme getiriyor. Tabii bu yıl birlikte çıktığımız ve Ankaradan soğuğu da yanımızda getirdiğimiz o yaz tatilini anmadan geçmek olmaz. Ve asla unutamadığımız o muhteşem lisen İAL. Umarım önünde daha nice güzel yıllar, biriktireceğin sayısız anı ve dönüp dönüp gülerek anlatacağın bir sürü hikâye olur arkadaşım. Ve umarım biz de bunların birçoğunda yine birlikte oluruz. ♡',color:'#81b9d8',petals:5,x:70.1,y:27.4},
{name:'Glayöl',meaning:'Güç ve kararlılık',asset:'gorseller/glayol-acmis.webp',photo:'glayol.jpg',message:'Bir Ebru Timinci, istediği şeyi elde etmeden onun peşini bırakmaz. Bıraktıysa da o şey zaten elde etmeye değer değildir. Yeni şeyler denemekten hiçbir zaman kaçınmaman ve kendine sürekli yeni challengelar koyman, ne kadar güçlü bir kadın olduğunu gösteriyor. Belki bütün bunlar artık senin normalin hâline gelmiş olabilir ama yaptığın her şey büyük bir cesaret, kararlılık ve emek gerektiriyor. Umarız bu yolda biraz da olsa yüklerini hafifletebiliyoruzdur. Unutma ki her zaman spotter olarak hemen başucunda, gerektiğinde o ağırlığı yakalamaya hazır bekliyoruz. ♡',color:'#d78195',petals:7,x:38.2,y:54.8},
{name:'Zinya',meaning:'Büyümek ve yeni başlangıçlar',asset:'gorseller/zinya-acmis.webp',photo:'zinya.jpg',message:'Yeni başlangıçlar bazen korkutucu olabiliyor. Bir anda kendimizi hiç beklemediğimiz yerlerde, hiç tahmin etmediğimiz hayatların içinde bulabiliyoruz. Senin de birçok şeye defalarca yeniden başladığını biliyoruz. Yeni ülkeler, yeni şehirler, yeni okullar, yeni insanlar ve yeni maceralar... Günün sonunda bütün bu yenilikler bizi biz yapıyor. Yaşadığımız her deneyimle, gördüğümüz her yeni yerle ve tanıdığımız her insanla biraz daha büyüyor, öğreniyor ve değişiyoruz. Umarız bundan sonraki bütün başlangıçların sana hep güzel şeyler getirir. Hayatının her döneminde seni mutlu eden, heyecanlandıran ve iyi ki bu yoldan gitmişim dedirten bir yol bulursun. ♡',color:'#e4a45e',petals:10,x:61.6,y:54.8},
{name:'Ayçiçeği',meaning:'Neşe ve kahkahalar',asset:'gorseller/aycicegi-acmis.webp',photo:'aycicegi.jpg',message:'Ebru Timinci denince akla gelen ilk şeylerden biri, o iç ısıtan gülümsemesi olurdu herhalde. Bazen bize kendimizi gerçek bir komedyen gibi hissettiren, neşe saçan kahkahaların... Belki de stand-up evrenını bu kadar sevmenin sebebi, gülmeyi ve güldürmeyi bu kadar sevmen arkadaşım. Umarız yüzünden o güzel gülümsemen hiç eksik olmaz ve hayat sana hep kahkahalarla hatırlayacağın anılar getirir. Tabii mesele sadece gülüşün de değil. Birbirinden efsane mimiklerini anmadan geçmek olmazdı. Bu yüzden bu çiçeği biraz da Ebru Timincinin benzersiz yüz ifadelerine adıyoruz. 🌻',color:'#f0c34b',petals:11,x:31.6,y:77.2},
{name:'Kaktüs',meaning:'Dayanıklılık',asset:'gorseller/kaktus-acmis.webp',photo:'kaktus.jpg',message:'Kaktüsler zorlu koşullara dayanabilmeleriyle bilinir. İşte bu yüzden bu çiçek, sana ne kadar dayanıklı olduğunu hatırlatmak için burada. Yonca Lodinin de dediği gibi düştüysek kalkarız daha ölmedik ya! Kelly Clarkson da "What Doesnt Kill You Makes You Stronger" diyerek bu konuda bize katılıyor. Aslında dayanıklılık üzerine söylenmiş daha bir sürü şarkı sözü bulabiliriz ama sanırım ne demek istediğimizi anladın. Sen de tıpkı bir kaktüs gibi, hayat bazen zor olsa da yaşamaya, denemeye ve yoluna devam etmeye kararlı insanlardansın. Kendi ayakların üzerinde durabilen, zorluklarla başa çıkabilen ve kolay kolay pes etmeyen birisin. Ama bence en önemlisi, bütün bunları yaparken kendi özüne sadık kalabilmen. Hayat seni nereye götürürse götürsün, her zaman kendin olmaya devam et arkadaşım. Çünkü sen, hayatımızda tanıdığımız en muhteşem insanlardan birisin. ♡',color:'#d990a8',petals:6,x:65.5,y:77.2}
];
const closeUpAssets=['frezya','lavanta','unutmabeni','glayol','zinya','aycicegi','kaktus'];
const key='ebrunun-bahcesi-v4';let done=[];try{done=JSON.parse(localStorage.getItem(key)||'[]').filter(n=>Number.isInteger(n)&&n>=0&&n<7)}catch{}let flowerIndex=null,stage=0,petals=0,animating=false;const root=document.getElementById('app');let timers=[];const schedule=(fn,ms)=>timers.push(setTimeout(fn,ms));function clearTimers(){timers.forEach(clearTimeout);timers=[]}function button(label,fn,other=''){return `<button class="button ${other}" onclick="${fn}">${label}</button>`}function safe(t){return String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function intro(){clearTimers();root.innerHTML=`<main class="scene start"><div style="font-size:52px">🌿</div><h1>Ebru'nun Bahçesi</h1><p>Bazı çiçekler suyla, bazıları sevgiyle büyür. Bu bahçede senin için sakladığımız yedi küçük sürpriz var.</p>${button('Bahçeye gir','garden()')}<p class="small">Umay ve Gökçe’den ♡</p></main>`}
function garden(){clearTimers();animating=false;flowerIndex=null;const all=done.length===7;root.innerHTML=`<main class="scene"><header class="bar"><strong>🌷 Ebru'nun Bahçesi</strong><span class="count">Açan çiçekler: ${done.length}/7</span></header><section class="garden" aria-label="Yedi saksılı bahçe">${flowers.map((f,i)=>done.includes(i)?`<img class="garden-plant" src="gorseller/${['frezya','lavanta','unutmabeni','glayol','zinya','aycicegi','kaktus'][i]}-cicek.webp" style="left:${[31.7,51.5,70.1,38.2,61.6,31.6,65.5][i]}%;top:${[21.5,21.4,21.4,49.1,48.9,71.6,72][i]}%;width:${[11.8,11.2,12.4,10.6,11.8,12.8,12][i]}%" alt="Açmış ${f.name} çiçeği">`:'').join('')}${flowers.map((f,i)=>`<button class="spot" style="left:${f.x}%;top:${f.y}%" onclick="openFlower(${i})" aria-label="${f.name} saksısını incele" title="${f.name}">${done.includes(i)?`<span class="check">✓</span>`:''}<span class="spot-name">${f.name}</span></button>`).join('')}</section><div class="foot">${all?`✨ Bütün çiçekler açtı! ${button('Son papatya 🌼','final()')}`:'Bir saksıya dokun, sulayıp anıyı keşfet. Açan çiçek bahçede kalır.'} <button class="button alt" style="font-size:12px;padding:6px 11px;margin-left:8px" onclick="resetGarden()">Bahçeyi sıfırla</button></div></main>`}
function resetGarden(){if(!confirm('Açılan çiçekleri sıfırlamak istiyor musun?'))return;done=[];try{localStorage.removeItem(key)}catch{}garden()}
function plantSVG(f){const petals=Array.from({length:f.petals},(_,i)=>{let deg=360*i/f.petals;return `<ellipse class="petal" cx="180" cy="70" rx="17" ry="39" fill="${f.color}" transform="rotate(${deg} 180 105)"/>`}).join('');return `<svg class="plant-svg" data-stage="${stage}" viewBox="0 0 360 340" role="img" aria-label="Büyüyen ${f.name} çiçeği"><path class="stem" d="M180 248 Q172 200 180 155 Q187 127 180 105"/><path class="leaf" d="M179 221 Q135 171 111 194 Q128 225 179 229Z"/><path class="leaf" d="M180 187 Q220 139 240 167 Q228 198 180 197Z"/><g class="flower-head">${petals}<circle class="center" cx="180" cy="105" r="18" fill="${f.name==='Ayçiçeği'?'#79512e':'#efc65a'}"/><ellipse class="bud" cx="180" cy="105" rx="12" ry="20" fill="${f.color}"/></g><g class="pot"><ellipse cx="180" cy="253" rx="79" ry="19" fill="#804a2f"/><path d="M99 253 L113 325 Q180 344 247 325 L261 253Z" fill="#bb704c"/><path d="M112 269 L122 322 Q180 336 237 322 L249 269Z" fill="#ca8059"/><rect x="96" y="244" rx="8" width="168" height="24" fill="#da9270"/><ellipse cx="180" cy="248" rx="75" ry="10" fill="#6d4937"/></g></svg>`}
function openFlower(i){clearTimers();flowerIndex=i;stage=done.includes(i)?3:0;animating=false;renderFlower()}
function renderFlower(){
 const f=flowers[flowerIndex],isDone=done.includes(flowerIndex),asset='gorseller/'+closeUpAssets[flowerIndex]+'-yakin.webp';
 root.innerHTML=`<main class="scene"><header class="bar"><strong>🌿 Ebru'nun Bahçesi</strong>${button('← Bahçeye dön','garden()','alt')}</header><div class="flower-page"><h2>${safe(f.name)}</h2><p class="sub">${safe(f.meaning)}</p><div id="flower-layout" class="flower-layout ${isDone?'has-note':''}"><div class="plant-column"><div class="flower-stage ${isDone?'is-bloomed':''}" id="flower-stage">${plantSVG(f)}<img class="watercolor-bloom" alt="${safe(f.name)} çiçeği" src="${asset}"><div id="drops" class="water-drops">💧💧</div></div><p id="status" class="status">${isDone?'Bu çiçek senin için açtı ♡':'Sulama kabına dokun ve büyümesini izle.'}</p><div id="controls">${isDone?'':button('💧 Saksıyı sula','water()')}</div></div><section class="memory ${isDone?'is-open':'hidden'}" id="memory"><article class="memory-paper"><h3>${safe(f.name)} · ${safe(f.meaning)}</h3><div class="memory-photos" id="photo-wrap"></div><p class="note-text">${safe(f.message)}</p><p class="signature">Sevgiyle, Umay & Gökçe ♡</p></article><div class="memory-actions">${button('Bahçeye dön','garden()','alt')}${done.length===7?button('Son papatya 🌼','final()'):''}</div></section></div></div></main>`;
 if(isDone)loadPhoto(f)
}
function loadPhoto(f){
 const wrap=document.getElementById('photo-wrap');if(!wrap)return;
 const stem=f.photo.replace(/\.[^.]+$/,'');const suffix=f.photo.match(/\.[^.]+$/)?.[0]||'.jpg';
 const names=[f.photo,stem+'-2'+suffix,stem+'-3'+suffix];let loaded=0,settled=0;
 wrap.innerHTML='';
 names.forEach(name=>{const img=new Image();img.alt=f.name+' için bir anı fotoğrafı';img.onload=()=>{loaded++;if(wrap.isConnected){img.dataset.order=String(names.indexOf(name));wrap.append(img);[...wrap.querySelectorAll('img')].sort((a,b)=>Number(a.dataset.order)-Number(b.dataset.order)).forEach(el=>wrap.append(el))}};img.onerror=()=>{settled++;if(settled===3&&!loaded&&wrap.isConnected)wrap.innerHTML='<div class="photo-missing">📷 Fotoğraf eklemek için <strong>fotograflar/'+safe(f.photo)+'</strong> dosyasını klasöre koy.</div>'};img.src='fotograflar/'+name});
}
function showMemory(){
 const mem=document.getElementById('memory'),layout=document.getElementById('flower-layout');
 if(!mem||!layout)return;
 mem.classList.remove('hidden');mem.classList.add('is-open');layout.classList.add('has-note');loadPhoto(flowers[flowerIndex]);
}
function water(){
 if(animating||flowerIndex===null||done.includes(flowerIndex))return;
 animating=true;
 document.getElementById('controls').innerHTML='<button disabled class="button">Çiçek büyüyor…</button>';
 document.getElementById('drops').classList.add('watering');
 const svg=document.querySelector('.plant-svg'),status=document.getElementById('status');
 schedule(()=>{stage=1;svg.dataset.stage='1';status.textContent='Filiz yavaşça uzuyor…'},300);
 schedule(()=>{stage=2;svg.dataset.stage='2';status.textContent='Yapraklar ve tomurcuk büyüyor…'},1380);
 schedule(()=>{stage=3;svg.dataset.stage='3';document.getElementById('flower-stage').classList.add('is-bloomed');status.textContent='Çiçek açıyor…'},2850);
 schedule(()=>{done.push(flowerIndex);done=[...new Set(done)];try{localStorage.setItem(key,JSON.stringify(done))}catch{}animating=false;document.getElementById('controls').innerHTML='';status.textContent='Bu çiçek senin için açtı ♡';showMemory()},4000)
}
function final(){if(done.length!==7){garden();return}clearTimers();petals=0;renderFinal()}function renderFinal(){const labels=['Olacak','Olmayacak','Olacak','Olmayacak','Olacak','Olmayacak','OLACAK!'];const completed=petals===7;const cX=180,cY=135,radius=68;const petalSVG=Array.from({length:7},(_,i)=>{const ang=(-90+(i*360/7))*Math.PI/180;const x=cX+Math.cos(ang)*radius;const y=cY+Math.sin(ang)*radius;const deg=(-90+(i*360/7));const fallx=Math.cos(ang)*28;const fally=Math.sin(ang)*28+34;return `<g class="daisy-petal-group ${i<petals?'gone':''}" style="--tx:${x}px;--ty:${y}px;--rot:${deg+90}deg;--fallx:${fallx}px;--fally:${fally}px" onclick="pickPetal()"><ellipse cx="0" cy="0" rx="20" ry="50" fill="#fffdf5" stroke="#d5c8ac" stroke-width="1.5"/></g>`}).join('');root.innerHTML=`<main class="scene"><header class="bar"><strong>🌼 Son papatya</strong>${button('Bahçeye dön','garden()','alt')}</header><div class="final"><h2>Bir dilek tut Ebru…</h2><p>Şimdi papatyanın yapraklarını tek tek kopar.</p><svg class="daisy-svg" viewBox="0 0 360 320" aria-label="Yaprakları koparılan papatya"><path d="M180 135 Q199 232 180 313" stroke="#6c9556" stroke-width="8" fill="none"/><path d="M187 242 Q235 201 247 244 Q226 257 187 257Z" fill="#8db77a"/>${petalSVG}<circle cx="180" cy="135" r="29" fill="#edbb4a" stroke="#bc8b31" stroke-width="2"/></svg><p class="final-status">${petals?labels[petals-1]:'Dileğin hazır mı?'}</p><p>${completed?'Tuttuğun bütün dilekler en güzel halleriyle gerçek olsun. İyi ki doğdun Ebru! Seni çok seviyoruz. ♡':`${7-petals} yaprak kaldı`}</p>${completed?button('Bahçeye dön','garden()'):button('Bir yaprak kopar','pickPetal()')}</div></main>`}function pickPetal(){if(petals<7)petals++;renderFinal()}
intro();
</script></body></html>
